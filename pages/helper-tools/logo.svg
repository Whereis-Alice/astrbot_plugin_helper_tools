<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 48" width="158" height="48"
     role="img" aria-label="辅助工具 HELPER / TOOLS">
  <!-- ============================================================
       astrbot_plugin_helper_tools / 辅助工具合集
       配色（与 WebUI 深色主题一致）：
         panel-a  #071614   深青画布起点
         panel-b  #0a1220   深靛画布终点
         mint     #34e0b0   主强调色
         cyan     #6ee7ff   次强调色
         violet   #a78bfa   点缀（只出现在描边渐变尾端 / 拉丁行的斜杠）
         fg       #e8f5f2   前景文字
         hairline rgba(126,199,189,0.16)  描边线
       ============================================================ -->
  <!-- 横向锁定版：左图标 48×48，右侧「辅助工具」+ 小字 HELPER / TOOLS。
       所有字形已转 <path>（轮廓取自 Noto Sans SC，SIL OFL 1.1），零外部字体依赖。
       建议最小使用宽度 120px；更小请换 logo-mark.svg。 -->
  <defs>
    <!-- 深色底：面板渐变 深青→深靛 -->
    <linearGradient id="htl-panel" x1="6" y1="4" x2="42" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071614"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <!-- 深色底：面板描边 mint→cyan，尾端收一点 violet -->
    <linearGradient id="htl-edge" x1="7" y1="5" x2="43" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34e0b0" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#6ee7ff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".55"/>
    </linearGradient>
    <!-- 深色底：「工」字符填充 mint→cyan（对角，覆盖整个字符包围盒） -->
    <linearGradient id="htl-glyph" x1="12.2" y1="13.4" x2="35.8" y2="34.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34e0b0"/>
      <stop offset="1" stop-color="#6ee7ff"/>
    </linearGradient>
    <!-- 浅色底变体：浅青面板 + 深青字符（对比度 > 4:1） -->
    <linearGradient id="htl-panelLight" x1="6" y1="4" x2="42" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef8f5"/>
      <stop offset="1" stop-color="#dbe9ed"/>
    </linearGradient>
    <linearGradient id="htl-glyphLight" x1="12.2" y1="13.4" x2="35.8" y2="34.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06614d"/>
      <stop offset="1" stop-color="#0a5069"/>
    </linearGradient>
    <!-- 拉丁小字：mint→cyan 横向渐变 -->
    <linearGradient id="htl-sub" x1="62" y1="38" x2="140" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34e0b0"/>
      <stop offset="1" stop-color="#6ee7ff"/>
    </linearGradient>
  </defs>
  <!-- 图标 -->
  <g>
      <!-- 容器：圆角面板 = 控制台 / 仪器面板 -->
      <rect x="2.75" y="2.75" width="42.5" height="42.5" rx="12.4"
            fill="url(#htl-panel)" stroke="url(#htl-edge)" stroke-width="1.5"/>
      <!-- 内部：几何化「工」= 工具，同时是工字梁（承重的辅助结构）；三笔，没有第四层细节 -->
      <g fill="url(#htl-glyph)">
        <rect x="13.6" y="13.4" width="20.8" height="4.4" rx="1.1"/>
        <rect x="21.4" y="17.8" width="5.2" height="12.4" rx="1"/>
        <rect x="12.2" y="30.2" width="23.6" height="4.4" rx="1.1"/>
      </g>
  </g>
