<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="img" aria-label="辅助工具合集">
<!-- ============================================================
     astrbot_plugin_helper_tools / 辅助工具合集
     标识：45° 两用扳手 —— 右上梅花头（六角套筒）+ 左下开口头。
     一笔成形、无容器背板，16px 仍可辨识。
     配色（取自 WebUI 主题）：
       mint    #34e0b0   主强调
       cyan    #6ee7ff   次强调
       iris    #9a8ef8   尾端点缀
       深色变体用上面三色；浅色变体换成 #06614d / #0a5069 / #453a96，
       在 #fff 与 #eff5f3 上对比度均 > 4.5:1。
     ============================================================ -->
  <!-- 用法：
       · 直接当 <img src="logo-mark.svg"> 用：跟随系统 prefers-color-scheme 自动切深/浅。
       · 内联进 HTML 后，给根 <svg> 或任一祖先加 class="ht-light" / "ht-dark" 强制变体。
       · 不支持 CSS 的渲染器（resvg / cairosvg / 部分图床）会忽略 <style>，
         落到 fill 表现属性上，即深色变体，仍然可用。
       · 注意：Chromium 不渲染跨文件 <use href="logo-mark.svg#id">，
         页面里需要变体切换时必须把本文件内联进 DOM。 -->
  <style>
    .ht-art { fill: url(#ht-grad); }
    .ht-light .ht-art, svg.ht-light .ht-art { fill: url(#ht-grad-light); }
    @media (prefers-color-scheme: light) {
      .ht-art { fill: url(#ht-grad-light); }
      .ht-dark .ht-art, svg.ht-dark .ht-art { fill: url(#ht-grad); }
    }
  </style>
  <defs>
    <linearGradient id="ht-grad" x1="41" y1="6" x2="4" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34e0b0"/>
      <stop offset=".55" stop-color="#6ee7ff"/>
      <stop offset="1" stop-color="#9a8ef8"/>
    </linearGradient>
    <linearGradient id="ht-grad-light" x1="41" y1="6" x2="4" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06614d"/>
      <stop offset=".55" stop-color="#0a5069"/>
      <stop offset="1" stop-color="#453a96"/>
    </linearGradient>
    <!-- 形状遮罩：外形（环头 + 柄 + 开口头）为白，套筒与开口为黑。
         用 mask 而不是 fill-rule 挖孔，是因为柄与两个头相互重叠，
         奇偶/非零填充都会在重叠处产生意外空洞。 -->
    <mask id="ht-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <rect x="0" y="0" width="48" height="48" fill="#000"/>
      <g fill="#fff">
        <!-- 梅花头（右上） -->
        <circle cx="32.2" cy="15.8" r="11.6"/>
        <!-- 开口头（左下） -->
        <circle cx="13.1" cy="34.9" r="8.6"/>
        <!-- 柄：沿 45° 轴连接两头，两端埋进头部内部，接缝不可见 -->
        <path d="M29.8 22.73 13.24 39.28 8.72 34.76 25.27 18.2Z"/>
      </g>
      <g fill="#000" stroke="#000" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
        <!-- 六角套筒；描边只为把尖角磨圆 -->
        <path d="M30.7 21.4 36.3 19.9 37.8 14.3 33.7 10.2 28.1 11.7 26.6 17.3Z"/>
        <!-- 开口：矩形故意越过头部轮廓，越界部分落在遮罩黑底上，无副作用 -->
        <path d="M13.95 38.29 6.74 45.51 2.49 41.26 9.71 34.05Z"/>
      </g>
    </mask>
  </defs>
  <path class="ht-art" d="M0 0h48v48H0Z" fill="url(#ht-grad)" mask="url(#ht-cut)"/>
</svg>
